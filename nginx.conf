server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reenvia las llamadas a la API al BFF, por el nombre del servicio en la
    # red de docker compose. Gracias a esto el frontend nunca necesita saber
    # la IP/dominio publico del servidor: llama a rutas relativas ("/api/..."),
    # sea que corra en localhost o en EC2.
    location /api/ {
        proxy_pass http://ms-campuslab-bff:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo real (ej. /dashboard, /login)
    # cae en index.html para que el router de Angular la resuelva del lado
    # del cliente. Sin esto, refrescar la pagina en una ruta que no sea "/"
    # devuelve 404 (nginx no conoce esas rutas, solo Angular).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
